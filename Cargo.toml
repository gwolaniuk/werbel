[package]
name = "werbel"
version = "0.1.0"
edition = "2021"
authors = ["gwolaniuk"]
license = "MIT"
description = "VST3/CLAP sytnezator werbla oparty na feedback synthesis (modelowanie rezonansu membrany) — wg metody z filmu 'Synthesize SNARES that sound REAL using the power of FEEDBACK'"

[lib]
crate-type = ["cdylib"]

[dependencies]
nice-plug = "0.4"
nice-plug-egui = "0.6"
egui = "0.37"

[profile.release]
lto = "thin"
opt-level = 3
strip = "symbols"